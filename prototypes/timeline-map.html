<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Timeline map prototype | Melih Sahin</title>
  <style>
    :root {
      --bg: #efe6d2;
      --ink: #2b2a33;
      --muted: #675f52;
      --accent: #b4440a;
      --road: #fbf6ea;
      --edge: #cdbf9f;
      --card: #fffaf0;
      --card-line: #d8cbb0;
      --grid: 90px;
      --gx: 0px;
      --gy: 0px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      background-image: radial-gradient(circle, rgba(120, 100, 60, 0.25) 1.2px, transparent 1.6px);
      background-size: var(--grid) var(--grid);
      background-position: var(--gx) var(--gy);
    }

    .stage.dragging { cursor: grabbing; }
    .stage:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

    .paths {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .paths path, .paths line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    #edge { stroke: var(--edge); stroke-width: 18px; }
    #road { stroke: var(--road); stroke-width: 12px; }
    #route { stroke: var(--accent); stroke-width: 2px; stroke-dasharray: 2 9; }
    #branches line { stroke: var(--edge); stroke-width: 4px; }

    .node {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform, opacity;
    }

    .pin {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--size);
      height: var(--size);
      padding: 0;
      border: 3px solid var(--accent);
      border-radius: 50%;
      background: var(--road);
      transform: translate(-50%, -50%);
      cursor: pointer;
    }

    .pin::after {
      content: "";
      position: absolute;
      inset: -16px;
    }

    .pin:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    .node[data-level="0"] { --size: 22px; }
    .node[data-level="0"] .pin { background: var(--accent); border-color: var(--card); box-shadow: 0 0 0 3px var(--accent); }
    .node[data-level="1"] { --size: 15px; }
    .node[data-level="2"] { --size: 11px; }
    .node[data-level="2"] .pin { border-color: var(--muted); background: #fff; }

    .label {
      position: absolute;
      top: 0;
      width: max-content;
      max-width: 9.5rem;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--card-line);
      border-radius: 10px;
      background: var(--card);
      box-shadow: 0 2px 8px rgba(60, 45, 20, 0.15);
      transform: translateY(-50%) scale(var(--pop, 1));
      cursor: pointer;
    }

    .side-right .label {
      left: calc(var(--size) / 2 + 12px);
      transform-origin: left center;
    }

    .side-left .label {
      right: calc(var(--size) / 2 + 12px);
      text-align: right;
      transform-origin: right center;
    }

    .label .date {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .label .name {
      display: block;
      font-size: 0.9rem;
      font-weight: 650;
    }

    .node[data-level="0"] .name { font-size: 1.05rem; }
    .node[data-level="2"] .name { font-size: 0.85rem; }

    .label .text {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .title {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 0.9rem 1rem 1.6rem;
      background: linear-gradient(var(--bg) 55%, transparent);
      pointer-events: none;
    }

    .title strong { display: block; font-size: 1.15rem; }
    .title span { font-size: 0.85rem; color: var(--muted); }

    .hud {
      position: absolute;
      left: 1rem;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      z-index: 2;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--card-line);
      border-radius: 999px;
      background: var(--card);
      font-size: 0.8rem;
      font-weight: 650;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      right: 1rem;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      z-index: 2;
      display: grid;
      gap: 0.5rem;
    }

    .controls button {
      width: 48px;
      height: 48px;
      border: 1px solid var(--card-line);
      border-radius: 50%;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(60, 45, 20, 0.15);
    }

    .controls button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .hint {
      position: absolute;
      left: 50%;
      bottom: calc(4.5rem + env(safe-area-inset-bottom));
      z-index: 2;
      margin: 0;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 0.8rem;
      white-space: nowrap;
      transform: translateX(-50%);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .hint.gone { opacity: 0; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .hint { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" tabindex="0" role="group"
       aria-label="Timeline map. Drag to pan, pinch or scroll to zoom, or use the plus and minus buttons. Arrow keys pan.">
    <svg class="paths" aria-hidden="true">
      <g id="world">
        <path id="edge"></path>
        <path id="road"></path>
        <g id="branches"></g>
        <path id="route"></path>
      </g>
    </svg>
    <div id="nodes"></div>

    <header class="title">
      <strong>Melih Sahin</strong>
      <span>Timeline map, newest at the top</span>
    </header>

    <div class="hud" id="level"></div>
    <div class="controls">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
    </div>
    <p class="hint" id="hint">Pinch, scroll, or tap a place to zoom</p>
  </div>

  <ol class="sr-only" id="sr-list" aria-label="Timeline, newest first"></ol>

  <script>
    const WORLD_W = 390;
    const WORLD_H = 2000;
    const ZMIN = 0.32;
    const ZMAX = 2.4;

    // Newest at the top, oldest at the bottom. Level 0 = chapters, 1 = milestones, 2 = detail.
    const data = [
      { level: 1, t: 0.03, date: "Sep 2026 - present", title: "Graduate Software Engineer, Deloitte", text: "" },
      { level: 0, t: 0.10, date: "2024 - present", title: "Early engineering career", text: "" },
      { level: 1, t: 0.16, date: "Feb - Aug 2026", title: "Sprift: unified property API", text: "One API for all property types, keeping two existing endpoints working." },
      { level: 2, t: 0.195, date: "2026", title: "Full-stack engineering", text: "Worked across the stack, including a lot of UI updates." },
      { level: 2, t: 0.225, date: "2026", title: "Light-mode refresh", text: "Moved the website from dark to light mode; turned Figma and HTML designs into code." },
      { level: 2, t: 0.265, date: "Aug - Sep 2025", title: "Onsite Manager, Balans International", text: "Managed logistics for a flat redevelopment in London." },
      { level: 1, t: 0.32, date: "Oct 2024 - May 2025", title: "Final-year project: Handling Randomness in Multi-Agent Scenarios", text: "Reinforcement-learning agents for a five-player card game." },
      { level: 1, t: 0.385, date: "Jun - Aug 2024", title: "Software Engineer Intern, Globant", text: "Led a team building a functional multi-agent AI prototype that informed an early commercial AI-agent product." },
      { level: 0, t: 0.50, date: "2022 - 2025", title: "University", text: "" },
      { level: 1, t: 0.56, date: "2022 - 2025", title: "BSc Computer Science and Mathematics, Queen Mary", text: "First Class with Honours (81.0%)." },
      { level: 2, t: 0.59, date: "2024 - 2025", title: "Student Ambassador", text: "Welcomed prospective students and families at university events." },
      { level: 2, t: 0.615, date: "Oct - Dec 2024", title: "Big Data Analysis with Apache Spark", text: "Analysed datasets of 20M+ records with PySpark." },
      { level: 2, t: 0.64, date: "Jan - Apr 2024", title: "PetMinder", text: "Seven-person team project; voted best PetMinder project among the teams." },
      { level: 2, t: 0.665, date: "2023 - 2025", title: "Mathematics Society events organiser", text: "Handled event approvals, venues, and publicity." },
      { level: 2, t: 0.69, date: "2023 - 2025", title: "Lab demonstrator", text: "Supported first- and second-year Computer Science students." },
      { level: 2, t: 0.715, date: "2023 - 2025", title: "Course representative", text: "Represented 60+ students in discussions with teaching staff." },
      { level: 2, t: 0.74, date: "2022 and 2023", title: "GMTK game jams", text: "Entered with \"Reverse Escort Mission\" and \"Roll of the Dice\"." },
      { level: 0, t: 0.80, date: "2017 - 2022", title: "School", text: "" },
      { level: 1, t: 0.86, date: "2017 - 2022", title: "The Kingston Academy", text: "A levels: Mathematics (A*), Further Mathematics (A), Physics (B), Computer Science (B)." },
      { level: 0, t: 0.93, date: "2016", title: "Arrival in the UK", text: "" },
      { level: 1, t: 0.98, date: "2016", title: "Moved from Turkey to the UK", text: "Moved for education and job opportunities." }
    ];

    const waypoints = [
      [120, 40], [290, 230], [100, 430], [300, 640], [110, 850], [290, 1060],
      [100, 1270], [300, 1480], [120, 1690], [250, 1880], [150, 1975]
    ];

    // Catmull-Rom spline converted to cubic Beziers for a smooth, curvy route.
    function smoothPath(points) {
      let d = `M${points[0][0]} ${points[0][1]}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ` C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${p2[0]} ${p2[1]}`;
      }
      return d;
    }

    const stage = document.getElementById("stage");
    const world = document.getElementById("world");
    const nodesEl = document.getElementById("nodes");
    const branchesEl = document.getElementById("branches");
    const route = document.getElementById("route");
    const levelEl = document.getElementById("level");
    const hint = document.getElementById("hint");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const d = smoothPath(waypoints);
    for (const id of ["edge", "road", "route"]) document.getElementById(id).setAttribute("d", d);

    const routeLength = route.getTotalLength();
    const pointAt = (t) => route.getPointAtLength(routeLength * Math.min(1, Math.max(0, t)));
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const ramp = (z, a, b) => clamp((z - a) / (b - a), 0, 1);

    // Place nodes on the route; detail nodes sit on short side streets.
    for (const item of data) {
      const p = pointAt(item.t);
      item.x = p.x;
      item.y = p.y;
      if (item.level === 2) {
        const a = pointAt(item.t - 0.004);
        const b = pointAt(item.t + 0.004);
        let nx = -(b.y - a.y);
        let ny = b.x - a.x;
        const m = Math.hypot(nx, ny) || 1;
        nx /= m;
        ny /= m;
        const dir = p.x < 195 ? 1 : -1;
        if (nx * dir < 0) { nx = -nx; ny = -ny; }
        item.bx = p.x;
        item.by = p.y;
        item.x = clamp(p.x + nx * 30, 24, WORLD_W - 24);
        item.y = p.y + ny * 30;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", item.bx);
        line.setAttribute("y1", item.by);
        line.setAttribute("x2", item.x);
        line.setAttribute("y2", item.y);
        branchesEl.append(line);
      }
    }

    const srList = document.getElementById("sr-list");

    for (const item of data) {
      const el = document.createElement("div");
      el.className = `node side-${item.x < 195 ? "right" : "left"}`;
      el.dataset.level = item.level;

      const pin = document.createElement("button");
      pin.type = "button";
      pin.className = "pin";
      pin.setAttribute("aria-label", `${item.title}, ${item.date}. Zoom to this place.`);

      const label = document.createElement("div");
      label.className = "label";
      const date = document.createElement("span");
      date.className = "date";
      date.textContent = item.date;
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.title;
      label.append(date, name);

      if (item.text) {
        const text = document.createElement("span");
        text.className = "text";
        text.textContent = item.text;
        label.append(text);
        item.textEl = text;
      }

      el.append(pin, label);
      el.addEventListener("click", () => {
        if (Date.now() - lastGesture < 300) return;
        flyTo(item);
      });
      nodesEl.append(el);
      item.el = el;
      item.labelEl = label;

      const li = document.createElement("li");
      li.textContent = `${item.date}: ${item.title}${item.text ? `. ${item.text}` : ""}`;
      srList.append(li);
    }

    const view = { z: 0.8, tx: 0, ty: 0 };
    let vw = 0;
    let vh = 0;
    let lastGesture = 0;
    let anim = 0;

    const baseScale = () => Math.min(vw, 520) / WORLD_W;
    const scale = () => view.z * baseScale();

    function measure() {
      vw = stage.clientWidth;
      vh = stage.clientHeight;
    }

    function clampPan() {
      const s = scale();
      const w = WORLD_W * s;
      const h = WORLD_H * s;
      const margin = 60;
      view.tx = w <= vw ? (vw - w) / 2 : clamp(view.tx, vw - w - margin, margin);
      view.ty = h <= vh ? (vh - h) / 2 : clamp(view.ty, vh - h - margin, margin);
    }

    function apply() {
      const s = scale();
      const z = view.z;
      world.setAttribute("transform", `translate(${view.tx} ${view.ty}) scale(${s})`);
      stage.style.setProperty("--grid", `${90 * s}px`);
      stage.style.setProperty("--gx", `${view.tx}px`);
      stage.style.setProperty("--gy", `${view.ty}px`);

      const milestoneOp = ramp(z, 0.5, 0.75);
      const detailOp = ramp(z, 1.4, 1.8);
      const chapterLabelOp = 1 - 0.9 * ramp(z, 1.0, 1.5);
      branchesEl.style.opacity = detailOp;

      for (const item of data) {
        const x = view.tx + item.x * s;
        const y = view.ty + item.y * s;
        const op = item.level === 0 ? 1 : item.level === 1 ? milestoneOp : detailOp;
        const off = x < -220 || x > vw + 220 || y < -120 || y > vh + 120;
        const el = item.el;
        el.style.transform = `translate(${x}px, ${y}px)`;
        el.style.opacity = op;
        el.style.visibility = op < 0.03 || off ? "hidden" : "visible";
        item.labelEl.style.opacity = item.level === 0 ? chapterLabelOp : 1;
        item.labelEl.style.pointerEvents = item.level === 0 && chapterLabelOp < 0.2 ? "none" : "auto";
        item.labelEl.style.setProperty("--pop", 0.7 + 0.3 * op);
        if (item.level === 1 && item.textEl) {
          item.textEl.style.display = detailOp < 0.03 ? "none" : "block";
          item.textEl.style.opacity = detailOp;
        }
      }

      levelEl.textContent = z < 0.6 ? "Zoom: chapters" : z < 1.5 ? "Zoom: milestones" : "Zoom: detail";
    }

    function zoomAt(cx, cy, newZ) {
      const s0 = scale();
      const wx = (cx - view.tx) / s0;
      const wy = (cy - view.ty) / s0;
      view.z = clamp(newZ, ZMIN, ZMAX);
      const s1 = scale();
      view.tx = cx - wx * s1;
      view.ty = cy - wy * s1;
      clampPan();
      apply();
    }

    function setFocus(z, fx, fy) {
      view.z = clamp(z, ZMIN, ZMAX);
      const s = scale();
      view.tx = vw / 2 - fx * s;
      view.ty = vh / 2 - fy * s;
      clampPan();
      apply();
    }

    function animateTo(target, ms = 550) {
      cancelAnimationFrame(anim);
      if (reducedMotion) {
        setFocus(target.z, target.fx, target.fy);
        return;
      }
      const s0 = scale();
      const start = { z: view.z, fx: (vw / 2 - view.tx) / s0, fy: (vh / 2 - view.ty) / s0 };
      const t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / ms);
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        setFocus(
          start.z * Math.pow(target.z / start.z, e),
          start.fx + (target.fx - start.fx) * e,
          start.fy + (target.fy - start.fy) * e
        );
        if (k < 1) anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    }

    function flyTo(item) {
      const targetZ = item.level === 0 ? 0.9 : item.level === 1 ? 1.9 : 2.2;
      animateTo({ z: Math.max(view.z, targetZ), fx: item.x, fy: item.y });
      dismissHint();
    }

    function zoomBy(factor) {
      const s = scale();
      animateTo({
        z: clamp(view.z * factor, ZMIN, ZMAX),
        fx: (vw / 2 - view.tx) / s,
        fy: (vh / 2 - view.ty) / s
      }, 350);
      dismissHint();
    }

    function dismissHint() { hint.classList.add("gone"); }

    // Pointer gestures: drag to pan, two fingers to pinch.
    const pointers = new Map();
    let pinch = null;

    function pinchState() {
      const [a, b] = [...pointers.values()];
      const rect = stage.getBoundingClientRect();
      return {
        dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
        cx: (a.x + b.x) / 2 - rect.left,
        cy: (a.y + b.y) / 2 - rect.top
      };
    }

    stage.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".controls")) return;
      cancelAnimationFrame(anim);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, drag: false });
      if (pointers.size === 2) pinch = pinchState();
    });

    stage.addEventListener("pointermove", (e) => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x;
      const dy = e.clientY - p.y;
      p.x = e.clientX;
      p.y = e.clientY;

      if (pointers.size === 2 && pinch) {
        const next = pinchState();
        zoomAt(next.cx, next.cy, view.z * (next.dist / pinch.dist));
        view.tx += next.cx - pinch.cx;
        view.ty += next.cy - pinch.cy;
        clampPan();
        apply();
        pinch = next;
        lastGesture = Date.now();
        dismissHint();
        return;
      }

      if (pointers.size === 1) {
        if (!p.drag && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) < 6) return;
        if (!p.drag) {
          p.drag = true;
          stage.setPointerCapture(e.pointerId);
          stage.classList.add("dragging");
        }
        view.tx += dx;
        view.ty += dy;
        clampPan();
        apply();
        lastGesture = Date.now();
        dismissHint();
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      pinch = null;
      if (pointers.size === 0) stage.classList.remove("dragging");
    }

    stage.addEventListener("pointerup", endPointer);
    stage.addEventListener("pointercancel", endPointer);

    stage.addEventListener("wheel", (e) => {
      e.preventDefault();
      cancelAnimationFrame(anim);
      const rect = stage.getBoundingClientRect();
      const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
      zoomAt(e.clientX - rect.left, e.clientY - rect.top, view.z * factor);
      dismissHint();
    }, { passive: false });

    stage.addEventListener("keydown", (e) => {
      const step = 80;
      const moves = { ArrowUp: [0, step], ArrowDown: [0, -step], ArrowLeft: [step, 0], ArrowRight: [-step, 0] };
      if (moves[e.key]) {
        e.preventDefault();
        view.tx += moves[e.key][0];
        view.ty += moves[e.key][1];
        clampPan();
        apply();
        dismissHint();
      } else if (e.key === "+" || e.key === "=") {
        zoomBy(1.5);
      } else if (e.key === "-") {
        zoomBy(1 / 1.5);
      }
    });

    document.getElementById("zoom-in").addEventListener("click", () => zoomBy(1.6));
    document.getElementById("zoom-out").addEventListener("click", () => zoomBy(1 / 1.6));

    window.addEventListener("resize", () => {
      measure();
      clampPan();
      apply();
    });

    measure();
    setFocus(0.8, 195, 380);
  </script>
</body>
</html>
